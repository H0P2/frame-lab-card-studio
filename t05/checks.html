<!doctype html><html lang="ko"><meta charset="utf-8"><title>T05 고정 검사</title>
<style>body{font:16px system-ui;max-width:900px;margin:24px auto;color:#18231a}button{padding:10px 18px}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #aab9aa;padding:8px;text-align:left}.pass{color:#146323}.fail{color:#a42121}iframe{width:1px;height:1px;border:0}</style>
<h1>T05 고정 검사 I01–I10</h1><p>localhost의 별도 검사 DB에서만 실행합니다. <a href="fixed-contract.md">고정 계약</a></p>
<button id="run">10개 검사 실행</button><p id="summary" aria-live="polite">미실행</p><table><thead><tr><th>ID</th><th>결과</th><th>관찰</th></tr></thead><tbody id="results"></tbody></table>
<iframe id="editor" src="../index.html?lab" title="검사 전용 편집기"></iframe>
<script type="module">
const frame=document.querySelector('#editor'),$=s=>document.querySelector(s),rows=[];
const ready=()=>new Promise((resolve,reject)=>{const start=Date.now();const poll=async()=>{const lab=frame.contentWindow?.FrameLab;if(lab&&await lab.whenStorageReady())return resolve(lab);if(Date.now()-start>10000)return reject(Error('편집기 저장소 연결 실패'));setTimeout(poll,100)};poll()});
const db=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('frame-lab-test-v2');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function records(){const d=await db();return new Promise((resolve,reject)=>{const r=d.transaction('templates').objectStore('templates').getAll();r.onsuccess=()=>{d.close();resolve(r.result)};r.onerror=()=>reject(r.error)})}
async function replace(all,lab){const d=await db();await new Promise((resolve,reject)=>{const tx=d.transaction('templates','readwrite'),s=tx.objectStore('templates');s.clear();all.forEach(t=>s.put(t));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});d.close();lab.cancelImportJSON();await lab.refreshTemplates()}
function mark(id,pass,detail){rows.push({id,result:pass?'PASS':'FAIL',detail});const tr=document.createElement('tr');tr.innerHTML=`<td>${id}</td><td class="${pass?'pass':'fail'}">${pass?'PASS':'FAIL'}</td><td></td>`;tr.lastChild.textContent=detail;$('#results').append(tr)}
async function check(id,fn){try{const detail=await fn();mark(id,true,detail)}catch(e){mark(id,false,e.message)}}
const expect=(condition,message)=>{if(!condition)throw Error(message)};
const clone=x=>structuredClone(x);
$('#run').onclick=async()=>{rows.length=0;$('#results').replaceChildren();$('#run').disabled=true;$('#summary').textContent='검사 중…';try{
const lab=await ready(),base=JSON.parse(await (await fetch('fixtures/new-one.json')).text()),template=base.templates[0],json=x=>JSON.stringify(x);
await check('I01',async()=>{await replace([],lab);const r=await lab.importJSON(json(base));expect(r.newCount===1&&r.updatedCount===0,'개수 불일치');expect((await records()).length===0,'적용 전 DB 변경');expect(!frame.contentDocument.querySelector('#importPreview').hidden,'확인 화면 없음');return '신규 1 · 갱신 0, DB 0건'});
await check('I02',async()=>{lab.cancelImportJSON();expect(frame.contentDocument.querySelector('#importPreview').hidden,'확인 화면 유지');expect((await records()).length===0,'취소 뒤 DB 변경');return '취소 뒤 DB 0건'});
await check('I03',async()=>{await lab.importJSON(json(base));const button=frame.contentDocument.querySelector('#applyImport');expect(!button.disabled,'적용 버튼 비활성');button.click();await new Promise(r=>setTimeout(r,200));const all=await records();expect(all.length===1&&all[0].id==='incoming-0001','적용 후 저장 실패');return '신규 1건 저장'});
await check('I04',async()=>{const existing={...clone(template),id:'existing-0001',name:'원래 이름',deleted:false,thumbnail:''};await replace([existing],lab);const incoming=clone(base);incoming.templates=[{...clone(template),id:'existing-0001',name:'새 이름'},{...clone(template),id:'incoming-0002'}];const r=await lab.importJSON(json(incoming));expect(r.newCount===1&&r.updatedCount===1,'혼합 개수 불일치');const all=await records();expect(all.length===1&&all[0].name==='원래 이름','적용 전 기존 레코드 변경');return '신규 1 · 갱신 1, DB 유지'});
await check('I05',async()=>{const button=frame.contentDocument.querySelector('#applyImport');expect(!button.disabled,'적용 버튼 비활성');button.click();await new Promise(r=>setTimeout(r,200));const all=await records();expect(all.length===2&&all.some(t=>t.id==='existing-0001'&&t.name==='새 이름')&&all.some(t=>t.id==='incoming-0002'),'혼합 적용 실패');return '갱신 1 · 신규 1 저장'});
await check('I06',async()=>{const before=json(await records());let failed=false;try{await lab.importJSON('{broken')}catch{failed=true}expect(failed,'손상 JSON 허용');expect(frame.contentDocument.querySelector('#importPreview').hidden,'오류 뒤 확인 화면 남음');expect(json(await records())===before,'오류 뒤 DB 변경');return '손상 JSON 거부, DB 유지'});
await check('I07',async()=>{const before=json(await records()),input=clone(base);input.templates.push(clone(template));let failed=false;try{await lab.importJSON(json(input))}catch{failed=true}expect(failed,'중복 ID 허용');expect(frame.contentDocument.querySelector('#importPreview').hidden,'확인 화면 남음');expect(json(await records())===before,'DB 변경');return '중복 ID 전체 거부'});
await check('I08',async()=>{const before=json(await records()),input=clone(base);input.templates.push({...clone(template),id:'bad-edit-0001',editor:{...clone(template.editor),ratio:'2:3'}});let failed=false;try{await lab.importJSON(json(input))}catch{failed=true}expect(failed,'잘못된 편집 설정 허용');expect(json(await records())===before,'첫 항목 저장됨');return '둘째 항목 오류로 전체 거부'});
await check('I09',async()=>{const full=Array.from({length:24},(_,i)=>({...clone(template),id:`existing-${String(i).padStart(4,'0')}`,deleted:false,thumbnail:''}));await replace(full,lab);let failed=false;try{await lab.importJSON(json(base))}catch{failed=true}expect(failed,'24개 한도 초과 허용');expect(frame.contentDocument.querySelector('#importPreview').hidden,'확인 화면 남음');expect((await records()).length===24,'DB 변경');return '25번째 신규 ID 거부, DB 24건'});
await check('I10',async()=>{await replace([],lab);await lab.importJSON(json(base));const last=clone(base);last.templates=[{...clone(template),id:'incoming-0002'}];const r=await lab.importJSON(json(last));expect(r.newCount===1&&r.updatedCount===0,'마지막 파일 미리보기 불일치');const button=frame.contentDocument.querySelector('#applyImport');expect(!button.disabled,'적용 버튼 비활성');button.click();await new Promise(r=>setTimeout(r,200));const all=await records();expect(all.length===1&&all[0].id==='incoming-0002','앞 파일이 저장되거나 마지막 파일 누락');return '마지막 파일만 적용'});
}catch(e){mark('환경',false,e.message)}finally{$('#summary').textContent=`PASS ${rows.filter(r=>r.result==='PASS').length} / ${rows.length} · FAIL ${rows.filter(r=>r.result==='FAIL').length}`;$('#run').disabled=false}};
</script></html>
