<!doctype html><html lang="ko"><meta charset="utf-8"><title>T05 추가 검토</title>
<style>body{font:16px system-ui;max-width:860px;margin:28px auto}button{padding:10px 16px}li{padding:7px}.pass{color:#17683c}.fail{color:#bd2c35}iframe{width:1px;height:1px;border:0}</style>
<h1>T05 추가 검토 검사</h1><p>고정 I01–I10을 변경하지 않는 별도 검사입니다. localhost의 합성 데이터만 사용합니다.</p>
<button id="run">추가 검사 실행</button><p id="summary">미실행</p><ol id="results"></ol>
<iframe id="editor" src="../index.html?lab" title="검토 전용 편집기"></iframe>
<script type="module">
const frame=document.querySelector('#editor'),results=document.querySelector('#results'),summary=document.querySelector('#summary');
const assert=(ok,message)=>{if(!ok)throw Error(message)};
const wait=async predicate=>{for(let i=0;i<100;i++){if(await predicate())return;await new Promise(r=>setTimeout(r,30))}throw Error('상태 대기 시간 초과')};
const open=()=>new Promise((resolve,reject)=>{const request=indexedDB.open('frame-lab-test-v2');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function read(){const db=await open();return new Promise((resolve,reject)=>{const request=db.transaction('templates').objectStore('templates').getAll();request.onsuccess=()=>{db.close();resolve(request.result)};request.onerror=()=>reject(request.error)})}
async function write(records,clear=false){const db=await open();await new Promise((resolve,reject)=>{const tx=db.transaction('templates','readwrite'),store=tx.objectStore('templates');if(clear)store.clear();for(const record of records)store.put(record);tx.oncomplete=resolve;tx.onabort=tx.onerror=()=>reject(tx.error)});db.close()}
async function test(label,fn){const row=document.createElement('li');try{await fn();row.textContent=`PASS · ${label}`;row.className='pass'}catch(error){row.textContent=`FAIL · ${label}: ${error.message}`;row.className='fail'}results.append(row)}
document.querySelector('#run').onclick=async()=>{results.replaceChildren();summary.textContent='검사 중…';document.querySelector('#run').disabled=true;try{
 await wait(()=>frame.contentWindow.FrameLab);const lab=frame.contentWindow.FrameLab;assert(await lab.whenStorageReady(),'저장소 연결 실패');
 const base=await (await fetch('fixtures/new-one.json')).json(),template=base.templates[0],json=JSON.stringify;
 const reset=async records=>{await write(records,true);lab.cancelImportJSON();await lab.refreshTemplates()};
 await test('미리보기 후 같은 ID가 생기면 조용히 덮어쓰지 않음',async()=>{await reset([]);await lab.importJSON(json(base));await write([{...template,name:'동시에 저장된 이름',deleted:false,thumbnail:''}]);let failed=false;try{await lab.applyImportJSON()}catch(error){failed=/목록이 바뀌었습니다/.test(error.message)}assert(failed,'목록 변경 거부 없음');const rows=await read();assert(rows.length===1&&rows[0].name==='동시에 저장된 이름','동시 변경이 덮어써짐');assert(frame.contentDocument.querySelector('#importPreview').hidden,'오래된 확인 화면 유지')});
 await test('미리보기 후 24개가 되면 적용을 거부함',async()=>{const baseRows=Array.from({length:23},(_,i)=>({...template,id:`review-${String(i).padStart(4,'0')}`,deleted:false,thumbnail:''}));await reset(baseRows);await lab.importJSON(json(base));await write([{...template,id:'review-0023',deleted:false,thumbnail:''}]);let failed=false;try{await lab.applyImportJSON()}catch(error){failed=/24개를 넘/.test(error.message)}assert(failed,'24개 한도 거부 없음');const rows=await read();assert(rows.length===24&&!rows.some(r=>r.id===template.id),'DB가 변경됨');assert(frame.contentDocument.querySelector('#importPreview').hidden,'오래된 확인 화면 유지')});
 await test('적용 중 취소 버튼이 비활성화됨',async()=>{await reset([]);await lab.importJSON(json(base));const task=lab.applyImportJSON();assert(frame.contentDocument.querySelector('#cancelImport').disabled,'적용 중 취소 가능');await task;assert((await read()).length===1,'적용 실패')});
}catch(error){const row=document.createElement('li');row.textContent=`FAIL · 환경: ${error.message}`;row.className='fail';results.append(row)}finally{const rows=[...results.children];summary.textContent=`PASS ${rows.filter(r=>r.className==='pass').length} / ${rows.length} · FAIL ${rows.filter(r=>r.className==='fail').length}`;document.querySelector('#run').disabled=false}};
</script>
