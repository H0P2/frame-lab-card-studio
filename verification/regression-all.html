<!doctype html><html lang="ko"><meta charset="utf-8"><title>전체 기능 재검사</title><h1>전체 기능 재검사</h1><button id="run">52개 기능 재검사</button><pre id="out">대기</pre><div id="files"></div><iframe id="suite" src="studio-checks.html" style="width:1450px;height:1100px"></iframe><script type="module">
const suite=document.querySelector('#suite'),out=document.querySelector('#out'),files=document.querySelector('#files');
function asset(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=name;files.append(a,document.createElement('br'));}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const all=[];try{const start=performance.now();while(!suite.contentDocument?.querySelector('#studio')||!suite.contentWindow?.ready){if(performance.now()-start>10000)throw Error('검사 화면 준비 실패');await new Promise(r=>setTimeout(r,50));}for(const id of ['extreme','ratios','templates','screens','basic','studio']){out.textContent=id+' 검사 중';const d=suite.contentDocument;await d.querySelector('#'+id).onclick();const result=JSON.parse(d.querySelector('#out').textContent);all.push({suite:id,...result});asset(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),'regression-'+id+'.json');if(result.rows.some(x=>x.result!=='PASS'))throw Error(id+' FAIL');}const report={suites:all,pass:all.flatMap(x=>x.rows).filter(x=>x.result==='PASS').length};asset(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),'regression-all.json');out.textContent=report.pass+' PASS';}catch(e){out.textContent='FAIL '+e.message;asset(new Blob([JSON.stringify({suites:all,error:e.message},null,2)],{type:'application/json'}),'regression-failure.json')}finally{document.querySelector('#run').disabled=false}};
</script></html>
