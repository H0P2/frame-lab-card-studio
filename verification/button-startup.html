<!doctype html><html lang="ko"><meta charset="utf-8"><title>버튼과 시작 상태 실제 검사</title><style>body{font:16px/1.5 sans-serif}iframe{width:1366px;height:768px;border:1px solid #555}pre{white-space:pre-wrap}</style><h1>버튼과 이전 탭 공존 검사</h1><p>독립 localhost 원점의 합성 카드와 실제 IndexedDB를 사용합니다. 기존 버전 탭을 유지한 상태와 클릭·키보드 처리기, 실제 PNG·JSON·WebM 생성 결과를 검사합니다.</p><button id="run">검사 실행</button><div id="files"></div><pre id="out">대기</pre><div id="frames"></div><script type="module">
const out=document.querySelector('#out'),frames=document.querySelector('#frames'),files=document.querySelector('#files');let rows=[],before=null,downloads=[],holds=[];
const wait=async(test,timeout=6000)=>{const start=performance.now();while(performance.now()-start<timeout){if(test()){await new Promise(r=>setTimeout(r,0));if(test())return;}await new Promise(r=>setTimeout(r,30))}throw Error('기대 상태에 도달하지 않음')};
const add=(name,expected,actual,pass)=>{rows.push({name,expected,actual,status:pass?'PASS':'FAIL'});out.textContent=JSON.stringify(rows,null,2);if(!pass)throw Error(name)};
const asset=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=name;files.append(a)};
const request=q=>new Promise((resolve,reject)=>{q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
const open=async(name,version,stores)=>{const q=indexedDB.open(name,version);q.onupgradeneeded=()=>{for(const store of stores)if(!q.result.objectStoreNames.contains(store))q.result.createObjectStore(store,{keyPath:'id'})};const db=await request(q);holds.push(db);return db};
const write=(db,store,value)=>new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(value);t.oncomplete=resolve;t.onerror=t.onabort=()=>reject(t.error)});
const editor={ratio:'1:1',text:'이전 탭의 공개 가능한 기록',fontSize:76,color:'#ffffff',position:'bottom',align:'left',fit:'cover',background:'#171922',scrim:true,image:null};
const legacy=async name=>{const db=await open(name,1,['templates']);const c=document.createElement('canvas');c.width=c.height=8;await write(db,'templates',{id:'legacy-fixture-01',name:'이전 템플릿',createdAt:'2026-10-05T00:00:00.000Z',updatedAt:'2026-10-05T00:00:00.000Z',editor,thumbnail:c.toDataURL(),deleted:false});return db};
const frame=src=>{const f=document.createElement('iframe');f.src=src;frames.append(f);return f};
const inspect=f=>({status:f.contentDocument.querySelector('#draftStatus')?.textContent,text:f.contentDocument.querySelector('#text')?.value,effect:f.contentDocument.querySelector('[data-effect][aria-pressed=true]')?.dataset.effect});
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
const old=await legacy('frame-lab-v1');const bf=frame('/review/fixtures/startup-before/index.html');await wait(()=>bf.contentDocument?.querySelector('[data-effect=fade]'));await new Promise(r=>setTimeout(r,350));bf.contentDocument.querySelector('[data-effect=fade]').click();await new Promise(r=>setTimeout(r,100));before={name:'이전 버전 탭과 함께 시작·페이드 클릭',expected:'fade 선택 및 기본 문구 표시',actual:inspect(bf),status:'FAIL'};if(before.actual.effect==='fade'||before.actual.text)throw Error('수정 전 문제가 재현되지 않음');bf.remove();old.close();
const held=await legacy('frame-lab-test-v2');let f=frame('/index.html?lab=1');await wait(()=>f.contentWindow?.FrameLab);let api=f.contentWindow.FrameLab,d=f.contentDocument,w=f.contentWindow;await api.whenStorageReady();add('이전 탭을 유지해도 준비 완료','원래 템플릿 유지 + 연결 완료',api.getStorageState(),api.getStorageState().templates&&api.getStorageState().drafts&&api.getStorageState().templateVersion===1&&api.snapshot().templates.some(t=>t.id==='legacy-fixture-01'));
for(const effect of ['none','fade','slide','typewriter','zoom']){d.querySelector(`[data-effect=${effect}]`).click();await wait(()=>api.snapshot().state.effect===effect);add('효과 클릭 '+effect,'선택 반영 및 none 이외 재생',{effect:api.snapshot().state.effect,playing:api.getStudioState().playing},api.getStudioState().playing===(effect!=='none'))}
d.querySelector('#playMotion').click();add('재생 정지 버튼','즉시 정지',api.getStudioState(),!api.getStudioState().playing);d.querySelector('#playMotion').click();add('재생 버튼','다시 재생',api.getStudioState(),api.getStudioState().playing);
const priorUndo=api.getStudioState().undo;for(const effect of ['fade','slide','typewriter','zoom','fade','slide','typewriter','zoom','fade','zoom'])d.querySelector(`[data-effect=${effect}]`).click();await wait(()=>api.getStudioState().undo===priorUndo+10);add('빠른 효과 클릭 10건','10번 모두 반영',{undoDelta:api.getStudioState().undo-priorUndo,effect:api.snapshot().state.effect},api.getStudioState().undo-priorUndo===10);
d.querySelector('#reduceMotion').click();add('움직임 줄이기','즉시 정지·영상 비활성',api.getStudioState(),!api.getStudioState().playing&&d.querySelector('#downloadVideo').disabled);d.querySelector('#reduceMotion').click();add('움직임 다시 허용','재생·영상 활성',{playDisabled:d.querySelector('#playMotion').disabled,videoDisabled:d.querySelector('#downloadVideo').disabled},!d.querySelector('#playMotion').disabled&&!d.querySelector('#downloadVideo').disabled);
for(const ratio of ['1:1','4:5','9:16']){d.querySelector(`[data-ratio="${ratio}"]`).click();await wait(()=>api.snapshot().state.ratio===ratio);add('화면비 '+ratio,'선택 반영',api.snapshot().layout,api.snapshot().state.ratio===ratio)}
for(const preset of ['neon','film','mono','editorial']){const text=api.snapshot().state.text;d.querySelector(`[data-preset=${preset}]`).click();await wait(()=>api.snapshot().state.style===preset);add('프리셋 '+preset,'스타일 변경·문구 유지',{style:api.snapshot().state.style},api.snapshot().state.text===text)}
d.querySelector('#resetStyle').click();await wait(()=>api.snapshot().state.style==='original');add('원본 스타일','original 복원',api.snapshot().state.style,true);
d.querySelector('#removeImage').click();await wait(()=>api.snapshot().state.image===null);add('이미지 제거','이미지 null',api.snapshot().state.image,true);d.querySelector('#sample').click();await wait(()=>!!api.snapshot().state.image);add('샘플 이미지','이미지 불러오기',{image:!!api.snapshot().state.image},true);
d.querySelector('#newCard').click();await wait(()=>api.snapshot().state.effect==='none'&&api.snapshot().state.ratio==='1:1');add('새 카드','현재 판 초기화',api.snapshot().state.text,api.snapshot().state.text==='오늘의 작은 발견\n내일의 새로운 시작');
d.querySelector('#text').value='버튼 확인 실제 문구';d.querySelector('#text').dispatchEvent(new w.Event('input',{bubbles:true}));const originalText=api.snapshot().state.text;d.querySelector('#undo').click();await wait(()=>api.snapshot().state.text!==originalText);add('실행 취소','이전 문구',api.snapshot().state.text,true);d.querySelector('#redo').click();await wait(()=>api.snapshot().state.text===originalText);add('다시 실행','변경 문구 복원',api.snapshot().state.text,true);
d.querySelector('#focusMode').click();add('집중 모드','패널 숨김',d.body.className,d.body.classList.contains('focus-mode'));d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));add('Escape','편집 패널 복귀',d.body.className,!d.body.classList.contains('focus-mode'));
const nativeAnchor=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download&&this.href.startsWith('blob:'))downloads.push({name:this.download,blob:fetch(this.href).then(r=>r.blob())});else nativeAnchor.call(this)};
const created=[];for(const name of ['검사 카드 A','검사 카드 B','검사 카드 C']){const oldIds=new Set(api.snapshot().templates.map(t=>t.id));d.querySelector('#templateName').value=name;d.querySelector('#createTemplate').click();await wait(()=>api.snapshot().templates.some(t=>!oldIds.has(t.id)));created.push(api.snapshot().templates.find(t=>!oldIds.has(t.id)));}add('새 템플릿 저장 3회','안정된 ID 세 개',created.map(t=>({id:t.id,name:t.name})),created.length===3);
const first=created[0];d.querySelector(`.template-row[data-id="${first.id}"] button`).click();await wait(()=>api.snapshot().selected===first.id&&!d.querySelector('#updateTemplate').disabled);add('템플릿 불러오기','선택한 ID',api.snapshot().selected,true);d.querySelector('#templateName').value='수정한 검사 카드';d.querySelector('#updateTemplate').click();await wait(()=>api.snapshot().templates.find(t=>t.id===first.id)?.name==='수정한 검사 카드');add('선택 항목 수정','같은 ID 수정',first.id,true);
const second=created[1];d.querySelector(`.template-row[data-id="${second.id}"] button[aria-label$="삭제"]`).click();await wait(()=>!api.snapshot().templates.some(t=>t.id===second.id));add('템플릿 삭제','정확한 ID 제거',second.id,true);d.querySelector('#undoDelete').click();await wait(()=>api.snapshot().templates.some(t=>t.id===second.id));add('삭제 취소','같은 ID 복원',second.id,true);
d.querySelector('#exportJSON').click();await wait(()=>downloads.some(x=>x.name.endsWith('.json')));const jsonBlob=await downloads.find(x=>x.name.endsWith('.json')).blob;const parsed=JSON.parse(await jsonBlob.text());add('JSON 내보내기','실제 템플릿 수 일치',parsed.templates.length,parsed.templates.length===api.snapshot().templates.length);
const dt=new w.DataTransfer();dt.items.add(new w.File([await jsonBlob.text()],'verified.json',{type:'application/json'}));d.querySelector('#jsonFile').files=dt.files;d.querySelector('#jsonFile').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>d.querySelector('#notice').textContent.includes('복원했습니다'));add('JSON 가져오기','실제 파일 input 처리·복원',d.querySelector('#notice').textContent,true);
d.querySelector('#download').click();await wait(()=>downloads.some(x=>x.name.endsWith('.png')));const png=await downloads.find(x=>x.name.endsWith('.png')).blob;const bitmap=await createImageBitmap(png);add('PNG 내려받기','실제 PNG 1080×1080',{bytes:png.size,width:bitmap.width,height:bitmap.height},bitmap.width===1080&&bitmap.height===1080);bitmap.close();asset(png,'button-proof.png');
d.querySelector('[data-effect=fade]').click();await wait(()=>api.snapshot().state.effect==='fade');d.querySelector('#downloadVideo').click();await wait(()=>api.getStudioState().recording);await wait(()=>!api.getStudioState().recording,12000);await wait(()=>downloads.some(x=>x.name.endsWith('.webm')));const video=await downloads.find(x=>x.name.endsWith('.webm')).blob;add('WebM 저장','실제 영상 생성 후 버튼 해제',{bytes:video.size,motionEnabled:!d.querySelector('#downloadVideo').disabled},video.size>1000&&!d.querySelector('#downloadVideo').disabled);asset(video,'button-proof.webm');
await api.flushDraft();const saved=api.snapshot().state.text;f.remove();f=frame('/index.html?lab=1');await wait(()=>f.contentWindow?.FrameLab);api=f.contentWindow.FrameLab;await api.whenStorageReady();add('새로고침·이전 탭 공존','문구·템플릿 유지',{text:api.snapshot().state.text,templates:api.snapshot().templates.length},api.snapshot().state.text===saved&&api.snapshot().templates.some(t=>t.id===first.id));
f.remove();const upgrade=indexedDB.open('frame-lab-test-v2',2);upgrade.onsuccess=()=>upgrade.result.close();upgrade.onupgradeneeded=()=>{};
f=frame('/index.html?lab=1');await wait(()=>f.contentWindow?.FrameLab);api=f.contentWindow.FrameLab;d=f.contentDocument;w=f.contentWindow;d.querySelector('[data-effect=fade]').click();await wait(()=>api.snapshot().state.effect==='fade');d.querySelector('#text').value='연결이 늦어도 지켜야 할 문구';d.querySelector('#text').dispatchEvent(new w.Event('input',{bubbles:true}));await api.whenStorageReady();add('저장 연결이 막혀도 편집','효과·문구 반영 및 복구 버튼',{storage:api.getStorageState(),text:api.snapshot().state.text,retryVisible:!d.querySelector('#retryStorage').hidden},api.snapshot().state.effect==='fade'&&api.snapshot().state.text==='연결이 늦어도 지켜야 할 문구'&&!d.querySelector('#retryStorage').hidden);
held.close();await new Promise(r=>setTimeout(r,100));d.querySelector('#retryStorage').click();await wait(()=>api.getStorageState().templates&&api.getStorageState().drafts);await wait(()=>d.querySelector('#retryStorage').hidden);add('저장소 다시 연결','사용자가 입력한 문구 유지',api.snapshot().state.text,api.snapshot().state.text==='연결이 늦어도 지켜야 할 문구');await api.flushDraft();
const v2=await open('frame-lab-v1',2,['templates','drafts']);await write(v2,'drafts',{id:'current',editor:{...editor,text:'이전 버전 자동 저장을 보존합니다'},updatedAt:new Date().toISOString()});const mf=frame('/index.html');await wait(()=>mf.contentDocument?.querySelector('#text')?.value==='이전 버전 자동 저장을 보존합니다');add('기존 v2 자동 저장 복원','이전 draft 이관',inspect(mf),true);
asset(new Blob([JSON.stringify({before,after:rows,method:'Actual browser IndexedDB connections held open; DOM click and input events run real handlers. Download anchor interception observes real generated files; focus Escape uses KeyboardEvent. Separate native mouse/keyboard checks supplement these results.'},null,2)],{type:'application/json'}),'button-startup-results.json');out.textContent=rows.length+' PASS · 수정 전 실제 FAIL 재현 · 결과 파일 준비';
}catch(e){out.textContent+='\nERROR '+e.message;asset(new Blob([JSON.stringify({before,after:rows,error:e.message},null,2)],{type:'application/json'}),'button-startup-failure.json')}finally{document.querySelector('#run').disabled=false}};
if(document.modelContext?.registerTool)document.modelContext.registerTool({name:'save_click_screenshot',description:'수정한 편집 화면의 실제 캡처를 로컬 파일로 보관합니다.',inputSchema:{type:'object',properties:{base64:{type:'string'}},required:['base64'],additionalProperties:false},execute:({base64})=>{asset(new Blob([Uint8Array.from(atob(base64),x=>x.charCodeAt(0))],{type:'image/jpeg'}),'button-screen.jpg');return{saved:true}}});
</script></html>
