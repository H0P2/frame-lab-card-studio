<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAME LAB — 짤·카드 스튜디오</title><meta name="description" content="이미지와 문구를 편집하고 PNG로 저장하는 짤·카드 스튜디오"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315161b'/%3E%3Cpath d='M8 24V8h16M8 16h12' stroke='%23c9f36c' stroke-width='4' fill='none'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="mark">F</span> FRAME <b>LAB</b></a><span class="top-label">짤·카드 스튜디오</span><button id="download" class="primary">PNG 내려받기</button></header>
<main class="workspace"><aside class="panel controls"><div class="section-title"><span>01</span><h1>카드 편집</h1></div><section><h2>이미지</h2><label class="upload-zone" for="imageFile"><span class="upload-icon">＋</span><strong>이미지 불러오기</strong><span>PNG · JPEG / 최대 8MB</span></label><input id="imageFile" type="file" accept="image/png,image/jpeg" class="file-input"><div class="inline"><button id="sample">샘플 이미지</button><button id="removeImage">이미지 제거</button></div><p id="imageInfo" class="muted">추상 그래픽 · 프로젝트 내 제작</p><label for="fit">이미지 배치</label><select id="fit"><option value="cover">채우기 · 가장자리 잘림</option><option value="contain">맞추기 · 전체 이미지</option></select><label for="background">배경 색</label><input id="background" type="color" value="#171922"></section><section><h2>문구</h2><label for="text">카드에 쓸 문구</label><textarea id="text" rows="3" maxlength="2000"></textarea><div class="inline"><label for="fontSize">크기 <output id="sizeValue">76</output></label><input id="textColor" type="color" aria-label="문구 색" value="#ffffff"></div><input id="fontSize" type="range" min="20" max="160" value="76"><label for="position">문구 위치</label><select id="position"><option value="bottom">아래</option><option value="center">가운데</option><option value="top">위</option></select><label for="align">정렬</label><select id="align"><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select><label class="check"><input id="scrim" type="checkbox" checked> 문구 뒤 배경 보정</label></section></aside>
<section class="stage"><div class="stage-toolbar"><div><span class="eyebrow">LIVE CANVAS</span><h2>미리보기</h2></div><div class="ratios" role="group" aria-label="화면비"><button data-ratio="1:1" aria-pressed="true">1:1</button><button data-ratio="4:5" aria-pressed="false">4:5</button><button data-ratio="9:16" aria-pressed="false">9:16</button></div></div><div class="canvas-wrap"><canvas id="preview" width="1080" height="1080" aria-label="카드 미리보기"></canvas></div><div class="canvas-meta"><span id="dimensions">1080 × 1080 px</span><span id="layoutInfo">PNG · 미리보기 그대로 저장</span></div><div id="notice" role="status" aria-live="polite">이미지와 문구를 바꾸면 바로 반영됩니다.</div></section>
<aside class="panel templates"><div class="section-title"><span>02</span><h2>내 템플릿</h2></div><p class="muted">이미지와 편집 설정을 함께 저장합니다.</p><label for="templateName">템플릿 이름</label><input id="templateName" type="text" maxlength="40" placeholder="예: 오늘의 한 문장"><div class="inline"><button id="createTemplate" class="primary">새로 저장</button><button id="updateTemplate" disabled>선택 항목 수정</button></div><div id="templateList" class="template-list"><p class="empty">첫 템플릿을 저장해 보세요.</p></div><div class="transfer"><h3>옮겨 쓰기</h3><button id="exportJSON">템플릿 JSON 내보내기</button><label class="file-button" for="jsonFile">템플릿 JSON 가져오기</label><input id="jsonFile" type="file" accept="application/json,.json" class="file-input"><p class="muted">이 브라우저에 보관됩니다. 다른 기기에서는 JSON 파일로 복원하세요.</p></div><a class="subtle-link" href="guide.html">사용 안내와 검사 기록</a></aside></main><script type="module" src="app.js"></script></body></html>
