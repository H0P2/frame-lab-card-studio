<!doctype html><html lang="ko"><meta charset="utf-8"><title>긴 한글 문구 — 수정 전 실제 검사</title><style>body{font:16px system-ui;background:#15161b;color:white;padding:24px}button{padding:15px}iframe{width:1366px;height:768px}pre{white-space:pre-wrap}</style><h1>긴 한글 문구 수정 전 검사</h1><button id="run">같은 긴 문구 검사</button><pre id="out">대기</pre><iframe id="f" src="before/index.html"></iframe><script>document.querySelector('button').onclick=async()=>{const d=document.querySelector('iframe').contentDocument;const input='작은 발견이 쌓여 새로운 시작이 됩니다. '.repeat(30);const t=d.querySelector('#text');t.value=input;t.dispatchEvent(new Event('input',{bubbles:true}));const c=d.querySelector('#preview');const ctx=c.getContext('2d');const width=ctx.measureText(input).width;const r={case:'long-korean',input,expected:'모든 문구가 카드의 안전 영역 안에 표시',actual:{textWidth:width,availableWidth:c.width-144,lines:1},result:width<=c.width-144?'PASS':'FAIL',reason:'자동 줄바꿈 없이 한 줄을 그려 오른쪽 문구가 잘림'};document.querySelector('#out').textContent=JSON.stringify(r,null,2);async function save(blob,name){const buf=new Uint8Array(await blob.arrayBuffer());for(let start=0,part=0;start<buf.length;start+=6000,part++){const data=btoa(String.fromCharCode(...buf.slice(start,start+6000)));await fetch('/__record?name='+name+'&part='+part+'&data='+encodeURIComponent(data))}}await save(new Blob([JSON.stringify(r,null,2)]),'before-long-korean.json');const b=await new Promise(r=>c.toBlob(r,'image/png'));await save(b,'before-long-korean.png')};</script></html>
