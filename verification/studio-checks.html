<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>FRAME LAB 실제 검사</title><style>body{font:15px system-ui;background:#101217;color:#fff;padding:20px}button,a{display:inline-block;padding:12px;margin:5px;background:#cef47b;color:#111;border:0;border-radius:6px}pre{white-space:pre-wrap;max-height:500px;overflow:auto}iframe{width:1366px;height:768px;border:0}#files a{background:#a8bded}</style></head><body><h1>FRAME LAB 실제 검사</h1><p>localhost 전용 검사. 실제 편집기 함수·Canvas·IndexedDB 사용. 결과를 다운로드하여 보관합니다.</p><button id="studio">새 편집·효과 검사</button><button id="extreme">12개 극단 입력 검사</button><button id="ratios">세 비율 픽셀 대조</button><button id="templates">템플릿·JSON 검사</button><button id="screens">두 기준 화면 검사</button><button id="basic">기본 편집·안전 검사</button><button id="finished">완성 이미지 3개</button><div id="files"></div><pre id="out">대기</pre><iframe id="editor" src="/index.html?lab=1"></iframe><script>
const f=document.querySelector('iframe'),out=document.querySelector('#out'),files=document.querySelector('#files');let api;async function ready(){for(let i=0;!f.contentWindow.FrameLab;i++){if(i>100)throw Error("편집기 초기화 시간 초과");await new Promise(r=>setTimeout(r,100));}api=f.contentWindow.FrameLab;await api.whenStorageReady?.();return api}
function result(name,expected,actual,pass){return {name,expected,actual,result:pass?'PASS':'FAIL'}}
async function asset(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=name;files.append(a);return a}
async function report(name,rows){const value={testedAt:new Date().toISOString(),method:'실제 브라우저의 편집기·Canvas·IndexedDB 실행',rows};out.textContent=JSON.stringify(value,null,2);await asset(new Blob([out.textContent],{type:'application/json'}),name+'.json')}
function layoutActual(){const l=api.snapshot().layout;return {width:l.width,height:l.height,fontSize:l.effective,lineCount:l.lines.length,withinBounds:l.withinBounds,lines:l.lines,crop:l.crop}}
async function file(name,type){const b=await (await fetch(name)).blob();return new File([b],name,{type})}
async function reject(name,work){const before=JSON.stringify(api.snapshot().state);let reason='';try{await work()}catch(e){reason=e.message}return result(name,'거부 이유 표시 + 기존 편집 보존',{reason,preserved:before===JSON.stringify(api.snapshot().state)},!!reason&&before===JSON.stringify(api.snapshot().state))}
function run(button,work){button.onclick=async()=>{button.disabled=true;try{await ready();await work()}catch(e){out.textContent='검사 오류: '+e.stack}finally{button.disabled=false}}}
run(document.querySelector('#extreme'),async()=>{const rows=[];const texts=[['긴 한글','작은 발견이 쌓여 새로운 시작이 됩니다. '.repeat(30)],['한영 혼합','한글 ABC 123 Network Security '+ 'mixed문자'.repeat(40)],['명시적 줄바꿈','첫째 줄\n\n셋째 줄\n끝'],['이모지','개발 👩🏽‍💻 보안 🔐 가족 👨‍👩‍👧‍👦 국기 🇰🇷\n'+ '✨'.repeat(40)],['빈 문구','']];for(const [name,text]of texts){await api.configure({ratio:'1:1',text,fontSize:76,position:'bottom'});const a=layoutActual();rows.push(result(name,'문구 보존 + 모든 줄이 카드 안전 영역 내부',a,a.withinBounds&&api.snapshot().state.text===text));if(name==='긴 한글')await asset(await api.exportPNG(),'after-long-korean.png')}
for(const [name,type]of [['portrait.png','image/png'],['landscape.jpg','image/jpeg'],['transparent.png','image/png'],['tiny.png','image/png']]){await api.configure({text:'실제 이미지 검사'});const a=await api.importImage(await file(name,type));rows.push(result(name,'PNG/JPEG 읽기 성공 + 편집 유지',{width:a.width,height:a.height,type:a.type,text:api.snapshot().state.text},a.width>0&&a.height>0&&api.snapshot().state.text==='실제 이미지 검사'))}
rows.push(await reject('위장 PNG',()=>file('fake.png','image/png').then(api.importImage)));rows.push(await reject('손상 PNG',()=>file('corrupt.png','image/png').then(api.importImage)));rows.push(await reject('8MB 초과',()=>api.importImage(new File([new Uint8Array(8*1024*1024+1)],'large.png',{type:'image/png'}))));await report('extreme-inputs',rows)});
run(document.querySelector('#ratios'),async()=>{const rows=[];await api.importImage(await file('landscape.jpg','image/jpeg'));for(const ratio of ['1:1','4:5','9:16']){await api.configure({ratio,text:'가장자리 확인 ABC 123\n'+ '미리보기와 파일의 줄바꿈이 같아야 합니다. '.repeat(8),fontSize:100,align:'right',position:'top'});const blob=await api.exportPNG(),im=await createImageBitmap(blob),c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);const p=f.contentDocument.querySelector('#preview'),a=p.getContext('2d').getImageData(0,0,p.width,p.height).data,b=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let mismatches=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])mismatches++;rows.push(result(ratio,'미리보기/PNG 전체 픽셀 동일·문구 안전 영역 내부',{...layoutActual(),mismatchedChannels:mismatches,downloadWidth:im.width,downloadHeight:im.height},mismatches===0&&im.width===p.width&&im.height===p.height&&api.snapshot().layout.withinBounds));im.close();await asset(blob,'comparison-'+ratio.replace(':','x')+'.png')}await report('ratio-comparison',rows)});
run(document.querySelector('#templates'),async()=>{const rows=[],ids=[];for(let i=0;i<3;i++){await api.configure({ratio:['1:1','4:5','9:16'][i],text:'사용자 카드 '+(i+1),image:api.sampleImage(i)},{normalize:false});ids.push((await api.createTemplate('검사 카드 '+(i+1))).id)}rows.push(result('3개 생성','서로 다른 안정 ID 3개',{ids},new Set(ids).size===3));const original=api.exportJSON();await api.loadTemplate(ids[0]);rows.push(result('불러오기','첫 카드 문구·비율 복원',{text:api.snapshot().state.text,ratio:api.snapshot().state.ratio},api.snapshot().state.text==='사용자 카드 1'&&api.snapshot().state.ratio==='1:1'));await api.configure({text:'수정한 문구'});await api.updateTemplate(ids[0],'수정 카드');await api.deleteTemplate(ids[1]);let list=api.snapshot().templates;rows.push(result('수정·삭제','수정 ID 유지 + 삭제 항목 없음',{templates:list},list.some(t=>t.id===ids[0]&&t.text==='수정한 문구')&&!list.some(t=>t.id===ids[1])));await new Promise(r=>{f.onload=r;f.contentWindow.location.reload()});await ready();list=api.snapshot().templates;rows.push(result('새로고침 유지','수정·삭제 결과 유지',{templates:list},list.some(t=>t.id===ids[0]&&t.name==='수정 카드'&&t.text==='수정한 문구')&&!list.some(t=>t.id===ids[1])));await api.importJSON(original);list=api.snapshot().templates;rows.push(result('정상 JSON 복원','원래 3개 ID·문구 복원',{templates:list},ids.every(id=>list.some(t=>t.id===id))&&list.find(t=>t.id===ids[0]).text==='사용자 카드 1'));const intact=api.exportJSON();for(const [name,raw]of [['잘못된 날짜 자료형',(()=>{const j=JSON.parse(original);j.templates[0].createdAt=1;return JSON.stringify(j)})()],['손상 문법','{"templates":'],['필수 누락',(()=>{const j=JSON.parse(original);delete j.templates[0].editor.ratio;return JSON.stringify(j)})()],['뒤쪽 항목 오류',(()=>{const j=JSON.parse(original);j.templates[0].name='저장되면 안 되는 이름';delete j.templates[2].editor.color;return JSON.stringify(j)})()]]){let reason='';try{await api.importJSON(raw)}catch(e){reason=e.message}rows.push(result(name,'전체 검증 실패 시 기존 목록 불변',{reason,preserved:api.exportJSON()===intact},!!reason&&api.exportJSON()===intact))}await asset(new Blob([original],{type:'application/json'}),'valid-templates.json');await report('template-json',rows)});
run(document.querySelector('#screens'),async()=>{const rows=[];for(const [width,height]of [[1366,768],[1920,1080],[390,844]]){f.style.width=width+'px';f.style.height=height+'px';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const d=f.contentDocument,w=f.contentWindow;const rect=id=>{const r=(id==='imageFile'?d.querySelector('label[for=imageFile]'):d.getElementById(id)).getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,visible:r.bottom<=height&&r.right<=width&&r.top>=0}};const image=rect('imageFile'),text=rect('text'),overflow=Math.max(0,d.documentElement.scrollWidth-w.innerWidth);rows.push(result(width+'×'+height,width>650?'첫 화면 이미지·문구 도구 + 가로 넘침 0':'가로 넘침 0',{viewport:[w.innerWidth,w.innerHeight],image,text,horizontalOverflow:overflow},overflow===0&&(width<=650||image.visible&&text.visible)))}await report('screen-checks',rows)});
run(document.querySelector('#finished'),async()=>{const rows=[];for(const [i,ratio,text]of [[0,'1:1','작은 발견을\n오래 바라보기'],[1,'4:5','지금의 한 걸음이\n내일의 방향이 된다'],[2,'9:16','새로운 시선\n새로운 시작']]){await api.configure({ratio,text,image:api.sampleImage(i),fontSize:92,position:i===1?'center':'bottom',align:i===1?'center':'left',color:'#ffffff',scrim:true},{normalize:false});const b=await api.exportPNG(),decoded=await createImageBitmap(b),decodedSize=[decoded.width,decoded.height];decoded.close();const name=['finished-square.png','finished-portrait.png','finished-story.png'][i];await asset(b,name);rows.push(result(name,'정상 PNG 디코딩 + 서로 다른 문구/비율',{ratio,text,bytes:b.size,decodedSize,...layoutActual()},api.snapshot().layout.withinBounds&&decodedSize[0]===1080))}await report('finished-images',rows)});

run(document.querySelector('#basic'),async()=>{const rows=[];await api.configure({text:'입력 변화 검사',image:api.sampleImage(),ratio:'1:1',fontSize:76,position:'bottom',color:'#ffffff'},{normalize:false});const d=f.contentDocument;const input=(id,value)=>{const el=d.getElementById(id);el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}))};let before=api.snapshot().layout.y;input('position','top');rows.push(result('문구 위치 즉시 반영','위치 입력 후 y가 즉시 변경',{before,after:api.snapshot().layout.y},api.snapshot().layout.y===72&&before!==72));input('fontSize','110');rows.push(result('문구 크기 즉시 반영','110px로 즉시 변경',{size:api.snapshot().layout.effective},api.snapshot().layout.effective===110));input('textColor','#c9f36c');const paint=d.querySelector('#preview'),paintLayout=api.snapshot().layout,pixels=paint.getContext('2d').getImageData(72,Math.floor(paintLayout.y),936,Math.ceil(paintLayout.lineHeight)).data;let matchingPixels=0;for(let j=0;j<pixels.length;j+=4)if(pixels[j]===201&&pixels[j+1]===243&&pixels[j+2]===108&&pixels[j+3]===255)matchingPixels++;rows.push(result('문구 색 즉시 반영','문구 영역에 선택 색상 실제 픽셀 존재',{state:api.snapshot().state.color,matchingPixels},api.snapshot().state.color==='#c9f36c'&&matchingPixels>0));let previous=JSON.stringify(api.snapshot().state);const dt=new DataTransfer();dt.items.add(await file('unsupported.txt','text/plain'));d.querySelector('#imageFile').files=dt.files;d.querySelector('#imageFile').dispatchEvent(new Event('change',{bubbles:true}));while(!d.querySelector('#notice').textContent.includes('실제 PNG'))await new Promise(r=>setTimeout(r,10));rows.push(result('지원하지 않는 파일 UI 거부','화면 거부 이유 + 기존 작업 유지',{notice:d.querySelector('#notice').textContent,preserved:JSON.stringify(api.snapshot().state)===previous},JSON.stringify(api.snapshot().state)===previous&&d.querySelector('#notice').dataset.error==='true'));rows.push(await reject('과도한 줄바꿈',()=>api.configure({text:'\n'.repeat(200)})));await api.importImage(await file('transparent.png','image/png'));const im=new Image();im.src=api.snapshot().state.image;await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);const alpha=c.getContext('2d').getImageData(0,0,1,1).data[3];rows.push(result('투명도 유지','가장자리 알파 0 유지',{alpha},alpha===0));await api.importImage(await file('gps-test.jpg','image/jpeg'));const src=api.snapshot().state.image,bytes=Uint8Array.from(atob(src.split(',')[1]),x=>x.charCodeAt(0));await asset(new Blob([bytes],{type:'image/jpeg'}),'normalized-gps.jpg');await asset(await api.exportPNG(),'gps-free-output.png');rows.push(result('메타데이터 정리','재인코딩한 JPEG 및 PNG 생성',{input:'합성 EXIF GPS를 삽입한 테스트용 JPEG',normalizedBytes:bytes.length},bytes.length>0));await report('basic-safety',rows)});
run(document.querySelector('#studio'),async()=>{
 const rows=[],d=f.contentDocument,w=f.contentWindow;
 await api.configure({text:'직접 움직이는 문구',ratio:'1:1',fontSize:76,align:'center',position:'center',offsetX:0,offsetY:0,style:'original',effect:'none'});
 const before=api.snapshot();await api.moveText(40,30);const moved=api.snapshot();rows.push(result('문구 직접 이동','x +40 · y +30',{before:before.layout.boxes[0],after:moved.layout.boxes[0]},Math.abs(moved.layout.boxes[0].x-before.layout.boxes[0].x-40)<.1&&Math.abs(moved.layout.y-before.layout.y-30)<.1));
 await api.undo();rows.push(result('실행 취소','위치 설정 복원',{state:api.snapshot().state},JSON.stringify(api.snapshot().state)===JSON.stringify(before.state)));
 await api.redo();rows.push(result('다시 실행','이동한 설정 복원',{state:api.snapshot().state},JSON.stringify(api.snapshot().state)===JSON.stringify(moved.state)));
 await api.moveText(5000,5000);rows.push(result('문구 경계 제한','끝까지 이동해도 카드 안전 영역 내부',{layout:api.snapshot().layout},api.snapshot().layout.withinBounds));
 await api.configure({offsetX:0,offsetY:0});const keyBefore=api.snapshot().layout.y;d.querySelector('#textSelection').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowDown',shiftKey:true,bubbles:true}));await new Promise(r=>setTimeout(r,10));rows.push(result('키보드 이동','Shift 방향키 +20px',{before:keyBefore,after:api.snapshot().layout.y},Math.abs(api.snapshot().layout.y-keyBefore-20)<.1));
 const el=d.querySelector('#textSelection'),r=el.getBoundingClientRect(),canvasRect=d.querySelector('#preview').getBoundingClientRect(),pointerBefore=api.snapshot().layout;
 // Browser-generated PointerEvents execute the real drag handler in the editor.
 el.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:3,button:0,clientX:r.x+20,clientY:r.y+20,bubbles:true}));
 el.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:3,clientX:r.x+30,clientY:r.y+35,bubbles:true}));
 el.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:3,bubbles:true}));await new Promise(r=>setTimeout(r,10));
 rows.push(result('드래그 이벤트 이동','표시 픽셀 움직임을 출력 좌표로 환산',{before:pointerBefore.y,after:api.snapshot().layout.y,expectedDelta:15*1080/canvasRect.height},Math.abs(api.snapshot().layout.y-pointerBefore.y-15*1080/canvasRect.height)<.2));
 for(const name of ['neon','film','mono','editorial']){const original=api.snapshot().state;await api.applyPreset(name);const after=api.snapshot().state;rows.push(result('프리셋 '+name,'스타일 반영 + 이미지·문구 보존',{style:after.style,imagePreserved:after.image===original.image,textPreserved:after.text===original.text},after.style===name&&after.image===original.image&&after.text===original.text))}
 await api.configure({ratio:'4:5',text:'자동 복구 검사\n실제 새로고침',effect:'fade',offsetY:.03});out.textContent='Studio: 복구 전 PNG';const saved=api.snapshot().state,savedPNG=f.contentDocument.querySelector('#preview').toDataURL('image/png');await api.flushDraft();await new Promise(r=>{f.onload=r;f.contentWindow.location.reload()});await ready();out.textContent='Studio: 복구 후 PNG';const restored=api.snapshot().state,restoredPNG=f.contentDocument.querySelector('#preview').toDataURL('image/png'),imageEqual=savedPNG===restoredPNG,settingsEqual=JSON.stringify({...saved,image:null})===JSON.stringify({...restored,image:null});rows.push(result('작업 자동 복구','새로고침 후 설정·최종 PNG 바이트 동일',{settingsEqual,imageEqual,beforePNGBytes:atob(savedPNG.split(',')[1]).length,afterPNGBytes:atob(restoredPNG.split(',')[1]).length,draftStatus:f.contentDocument.querySelector('#draftStatus').textContent},settingsEqual&&imageEqual));
 out.textContent='Studio: JSON 호환';const old=JSON.parse(api.exportJSON());if(old.templates.length){for(const t of old.templates){for(const k of ['offsetX','offsetY','style','effect'])delete t.editor[k]}await api.importJSON(JSON.stringify(old));rows.push(result('기존 JSON 호환','새 기능 항목 없는 이전 템플릿도 복원',{count:api.snapshot().templates.length},api.snapshot().templates.length===old.templates.length))}
 out.textContent='Studio: 움직임 선택권';await api.configure({effect:'fade'});const dd=f.contentDocument;dd.querySelector('#reduceMotion').checked=false;api.playMotion();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));rows.push(result('움직임 시작','미리보기 실행 중',{playing:api.getStudioState().playing},api.getStudioState().playing));
 dd.querySelector('#reduceMotion').checked=true;dd.querySelector('#reduceMotion').dispatchEvent(new Event('change'));rows.push(result('움직임 즉시 줄이기','재생 정지 + 영상 버튼 비활성',{...api.getStudioState(),disabled:dd.querySelector('#downloadVideo').disabled},!api.getStudioState().playing&&dd.querySelector('#downloadVideo').disabled));
 dd.querySelector('#reduceMotion').checked=false;dd.querySelector('#reduceMotion').dispatchEvent(new Event('change'));
 for(const effect of ['fade','slide','typewriter','zoom']){
  out.textContent='Studio: WebM '+effect;await api.configure({effect,ratio:'1:1'});const motion=await api.exportVideo();const url=URL.createObjectURL(motion),v=document.createElement('video');v.src=url;v.muted=true;await new Promise((resolve,reject)=>{v.onloadeddata=resolve;v.onerror=()=>reject(Error('영상 디코딩 실패'))});if(!Number.isFinite(v.duration)){v.currentTime=1e9;await new Promise(r=>v.onseeked=r)}
  const data={effect,bytes:motion.size,width:v.videoWidth,height:v.videoHeight,duration:v.duration};rows.push(result('WebM '+effect,'실제 인코딩 파일 디코딩 + 1080×1080',data,motion.size>0&&v.videoWidth===1080&&v.videoHeight===1080));await asset(motion,'motion-'+effect+'.webm');URL.revokeObjectURL(url)
 }
 await report('studio-checks',rows);
});
if(document.modelContext?.registerTool){document.modelContext.registerTool({name:'save_review_screenshot',description:'현재 로컬 편집기 검사 화면 캡처를 로컬 결과 파일에 보관합니다.',inputSchema:{type:'object',properties:{base64:{type:'string'}},required:['base64'],additionalProperties:false},execute:async({base64})=>{const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));await asset(new Blob([bytes],{type:'image/jpeg'}),'studio-screen.jpg');return {saved:'studio-screen.jpg'}}})}

</script></body></html>
